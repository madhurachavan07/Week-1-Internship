<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 16px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        .radio {
            width: auto;
            margin-bottom: 10px;
        }

        .checkbox {
            width: auto;
        }

        button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            position: relative;
            left: 140px;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <h1>Contact Us</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject:</label>
        <select id="subject" name="subject" required>
            <option value="">Select Subject</option>
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
            <option value="feedback">Feedback</option>
        </select>

        <label>Preferred Contact Time:</label>

        <input class="radio" type="radio" id="morning"
               name="contact_time" value="morning" required>
        <label for="morning">Morning</label>

        <input class="radio" type="radio" id="evening"
               name="contact_time" value="evening">
        <label for="evening">Evening</label>

        <br>

        <input class="checkbox" type="checkbox"
               id="subscribe" name="subscribe">

        <label for="subscribe">Subscribe to updates</label>

        <label for="message">Message:</label>
        <textarea id="message" name="message"
                  rows="5" required></textarea>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
